<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-magnetic-force diagram-desc-magnetic-force"><title id="diagram-title-magnetic-force">匀强磁场中的圆周轨道</title><desc id="diagram-desc-magnetic-force">示例 q&gt;0、B 向纸里；初速度向右时，磁力向上指向圆心。负电荷在相同 v、B 下反向弯曲。 R：轨道半径；v ⟂ B；图中 q 取正</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-magnetic-force" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><circle cx="65" cy="45" r="11" class="muted"/><line x1="60" y1="40" x2="70" y2="50" class="muted"/><line x1="60" y1="50" x2="70" y2="40" class="muted"/><circle cx="145" cy="45" r="11" class="muted"/><line x1="140" y1="40" x2="150" y2="50" class="muted"/><line x1="140" y1="50" x2="150" y2="40" class="muted"/><circle cx="225" cy="45" r="11" class="muted"/><line x1="220" y1="40" x2="230" y2="50" class="muted"/><line x1="220" y1="50" x2="230" y2="40" class="muted"/><circle cx="305" cy="45" r="11" class="muted"/><line x1="300" y1="40" x2="310" y2="50" class="muted"/><line x1="300" y1="50" x2="310" y2="40" class="muted"/><circle cx="385" cy="45" r="11" class="muted"/><line x1="380" y1="40" x2="390" y2="50" class="muted"/><line x1="380" y1="50" x2="390" y2="40" class="muted"/><circle cx="225" cy="146" r="90" class="dash"/><circle cx="225" cy="146" r="4" class="point"/><text x="178" y="128" class="" text-anchor="start">O（圆心）</text><circle cx="225" cy="236" r="7" class="source"/><text x="169" y="261" class="" text-anchor="start">q &gt; 0</text><line x1="225" y1="236" x2="340" y2="236" class="source" marker-end="url(#diagram-arrow-magnetic-force)"/><text x="316" y="222" class="" text-anchor="start">v</text><line x1="225" y1="234" x2="225" y2="170" class="field" marker-end="url(#diagram-arrow-magnetic-force)"/><text x="239" y="199" class="" text-anchor="start">F</text><line x1="225" y1="146" x2="314" y2="146" class="dim"/><text x="273" y="166" class="" text-anchor="start">R</text><path d="M225 236 A90 90 0 0 0 315 146" class="field" marker-end="url(#diagram-arrow-magnetic-force)"/><text x="66" y="291" class="small" text-anchor="start">⊗ B；圆心在磁力指向的一侧</text></svg>