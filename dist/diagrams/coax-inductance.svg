<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-coax-inductance diagram-desc-coax-inductance"><title id="diagram-title-coax-inductance">薄壁同轴电缆的夹层</title><desc id="diagram-desc-coax-inductance">图为两个薄圆筒的横截面，两壁电流等大反向；理想磁场仅在 a&lt;r&lt;b。L′ 不含实心导体的内部自感。 a：内薄筒半径；b：外薄筒半径；只计算两筒之间的场能</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-coax-inductance" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><circle cx="220" cy="151" r="112" class="wire"/><circle cx="220" cy="151" r="52" class="wire"/><line x1="220" y1="151" x2="272" y2="151" class="dim"/><text x="242" y="174" class="" text-anchor="start">a</text><line x1="220" y1="151" x2="220" y2="39" class="dim"/><text x="234" y="92" class="" text-anchor="start">b</text><circle cx="272" cy="151" r="11" class="muted"/><circle cx="272" cy="151" r="2" class="point"/><circle cx="332" cy="151" r="11" class="muted"/><line x1="327" y1="146" x2="337" y2="156" class="muted"/><line x1="327" y1="156" x2="337" y2="146" class="muted"/><text x="280" y="218" class="s