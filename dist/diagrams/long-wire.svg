<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-long-wire diagram-desc-long-wire"><title id="diagram-title-long-wire">长直导线的垂距</title><desc id="diagram-desc-long-wire">图示电流沿导线向上，P 点磁场向纸里；r 从轴线垂直量取。半无限模型额外要求 P 位于端点的垂线上。 r：到轴线的垂距；⋮：继续延伸至无穷远</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-long-wire" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><line x1="150" y1="259" x2="150" y2="43" class="source" marker-end="url(#diagram-arrow-long-wire)"/><text x="128" y="29" class="" text-anchor="start">⋮</text><text x="129" y="288" class="" text-anchor="start">⋮</text><text x="168" y="65" class="" text-anchor="start">I</text><circle cx="150" cy="150" r="4" class="point"/><text x="159" y="142" class="" text-anchor="start">垂足 O</text><circle cx="350" cy="150" r="4" class="point"/><text x="359" y="142" class="" text-anchor="start">P</text><line x1="150" y1="150" x2="344" y2="150" class="dim"/><text x="249" y="174" class="" text-anchor="start">r</text><circle cx="400" cy="149" r="11" class="muted"/><line x1="395" y1="144" x2="405" y2="154" class="muted"/><line x1="395" y1="154" x2="405" y2="144" class="muted"/><text x="378" y="186" class="small" text-anchor="start">B 向里</text><text x="63" y="291" class="small" text-anchor="start">理想导线向两端无限延伸</text></svg>