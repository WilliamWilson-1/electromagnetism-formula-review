<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-spherical-capacitor diagram-desc-spherical-capacitor"><title id="diagram-title-spherical-capacitor">同心球面 / 同轴圆柱电容器</title><desc id="diagram-desc-spherical-capacitor">图为过公共中心的截面；电场存在于两极板之间的介质。圆柱模型另有沿轴向长度 L。 a：内极板半径；b：外极板内表面半径；圆柱长度 L 沿轴向，垂直本截面</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-spherical-capacitor" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><circle cx="235" cy="151" r="113" class="body"/><circle cx="235" cy="151" r="102" class="hole"/><circle cx="235" cy="151" r="52" class="source"/><circle cx="235" cy="151" r="4" class="point"/><text x="244" y="143" class="" text-anchor="start">O</text><line x1="235" y1="151" x2="287" y2="151" class="dim"/><text x="260" y="176" class="" text-anchor="start">a</text><line x1="235" y1="151" x2="235" y2="49" class="dim"/><text x="248" y="98" class="" text-anchor="start">b</text><line x1="295" y1="151" x2="327" y2="151" class="field" marker-end="url(#diagram-arrow-spherical-capacitor)"/><text x="304" y="135" class="" text-anchor="start">E</text><text x="130" y="287" class="small" text-anchor="start">介质 ε：a &lt; r &lt; b；内 +Q、外 −Q</text></svg>