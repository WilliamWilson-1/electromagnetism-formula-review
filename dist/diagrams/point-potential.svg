<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-point-potential diagram-desc-point-potential"><title id="diagram-title-point-potential">点电荷、方向与距离</title><desc id="diagram-desc-point-potential">画出正源电荷的示例；负源电荷电场反向。库仑力还须乘受力电荷的符号。 r：两点的直线距离；r̂：从源到场点的单位方向</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-point-potential" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><circle cx="110" cy="145" r="23" class="source"/><text x="110" y="151" class="" text-anchor="middle">+q</text><circle cx="360" cy="145" r="4" class="point"/><text x="369" y="137" class="" text-anchor="start">P / q<tspan baseline-shift="sub" font-size="75%">2</tspan></text><line x1="135" y1="145" x2="330" y2="145" class="field" marker-end="url(#diagram-arrow-point-potential)"/><text x="236" y="127" class="small" text-anchor="middle">r̂ → E（正源）</text><line x1="110" y1="207" x2="360" y2="207" class="dim"/><text x="235" y="229" class="small" text-anchor="middle">r：从源电荷量到场点</text><text x="105" y="101" class="small" text-anchor="start">源点 q<tspan baseline-shift="sub" font-size="75%">1</tspan></text><text x="286" y="270" class="small" text-anchor="middle">P 为观察点；图中长度不按比例</text></svg>