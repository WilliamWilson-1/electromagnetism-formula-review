<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-coupling-factor diagram-desc-coupling-factor"><title id="diagram-title-coupling-factor">自感线圈与互感联系</title><desc id="diagram-desc-coupling-factor">两线圈通过部分共同磁通相联系。图仅示意耦合，不用端子位置推断相助 / 相消；具体绕向须另给。 L1、L2：自感；M：互感，不是磁化强度；Φ21：先受感、后场源</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-coupling-factor" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><rect x="75" y="104" width="330" height="72" rx="4" class="body"/><ellipse cx="115" cy="140" rx="11" ry="55" class="source"/><ellipse cx="137" cy="140" rx="11" ry="55" class="source"/><ellipse cx="159" cy="140" rx="11" ry="55" class="source"/><ellipse cx="181" cy="140" rx="11" ry="55" class="source"/><ellipse cx="203" cy="140" rx="11" ry="55" class="source"/><ellipse cx="285" cy="140" rx="11" ry="55" class="wire"/><ellipse cx="307" cy="140" rx="11" ry="55" class="wire"/><ellipse cx="329" cy="140" rx="11" ry="55" class="wire"/><ellipse cx="351" cy="140" rx="11" ry="55" class="wire"/><ellipse cx="373" cy="140" rx="11" ry="55" class="wire"/><line x1="117" y1="140" x2="365" y2="140" class="field" marker-end="url(#diagram-arrow-coupling-factor)"/><text x="105" y="56" class="small" text-anchor="start">线圈1：N<tspan baseline-shift="sub" font-size="75%">1</tspan>、I<tspan baseline-shift="sub" font-size="75%">1</tspan>、L<tspan baseline-shift="sub" font-size="75%">1</tspan></text><text x="275" y="228" class="small" text-anchor="start">线圈2：N<tspan baseline-shift="sub" font-size="75%">2</tspan>、I<tspan baseline-shift="sub" font-size="75%">2</tspan>、L<tspan baseline-shift="sub" font-size="75%">2</tspan></text><text x="93" y="279" class="small" text-anchor="start">Φ<tspan baseline-shift="sub" font-size="75%">2</tspan><tspan baseline-shift="sub" font-size="75%">1</tspan>：源1穿入线圈2；M 表示耦合大小</text></svg>