<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-surface-field diagram-desc-surface-field"><title id="diagram-title-surface-field">导体表面紧外侧</title><desc id="diagram-desc-surface-field">图示正表面电荷；表面紧外侧的有向法向分量 En=σ/ε0。导体材料内 E=0。 σ：表面局部电荷密度；n̂：从导体内部指向外侧</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-surface-field" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><rect x="70" y="55" width="150" height="200" rx="4" class="body"/><line x1="220" y1="45" x2="220" y2="265" class="wire"/><text x="222" y="86" class="" text-anchor="start">+</text><text x="222" y="130" class="" text-anchor="start">+</text><text x="222" y="174" class="" text-anchor="start">+</text><text x="222" y="218" class="" text-anchor="start">+</text><text x="95" y="141" class="" text-anchor="start">导体</text><text x="95" y="168" class="" text-anchor="start">E=0</text><line x1="235" y1="150" x2="398" y2="150" class="field" marker-end="url(#diagram-arrow-surface-field)"/><text x="283" y="123" class="" text-anchor="start">n̂，E<tspan baseline-shift="sub" font-size="75%">n</tspan></text><text x="270" y="230" class="small" text-anchor="start">紧外侧真空</text></svg>