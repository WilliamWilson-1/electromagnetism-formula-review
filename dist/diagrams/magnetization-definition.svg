<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-magnetization-definition diagram-desc-magnetization-definition"><title id="diagram-title-magnetization-definition">均匀磁化与表面束缚电流</title><desc id="diagram-desc-magnetization-definition">截面图中 M 指向纸外，侧面电流沿逆时针。端面法向与 M 平行时 Kb=0。 M：单位体积的磁矩和；Kb：单位长度的表面电流，不是 A/m²</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-magnetization-definition" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><circle cx="227" cy="151" r="100" class="body"/><circle cx="175" cy="109" r="11" class="muted"/><circle cx="175" cy="109" r="2" class="point"/><circle cx="175" cy="160" r="11" class="muted"/><circle cx="175" cy="160" r="2" class="point"/><circle cx="175" cy="209" r="11" class="muted"/><circle cx="175" cy="209" r="2" class="point"/><circle cx="225" cy="109" r="11" class="muted"/><circle cx="225" cy="109" r="2" class="point"/><circle cx="225" cy="160" r="11" class="muted"/><circle cx="225" cy="160" r="2" class="point"/><circle cx="225" cy="209" r="11" class="muted"/><circle cx="225" cy="209" r="2" class="point"/><circle cx="275" cy="109" r="11" class="muted"/><circle cx="275" cy="109" r="2" class="point"/><circle cx="275" cy="160" r="11" class="muted"/><circle cx="275" cy="160" r="2" class="point"/><circle cx="275" cy="209" r="11" class="muted"/><circle cx="275" cy="209" r="2" class="point"/><path d="M326 150 A100 100 0 0 0 227 51" class="source" marker-end="url(#diagram-arrow-magnetization-definition)"/><text x="330" y="99" class="" text-anchor="start">K<tspan baseline-shift="sub" font-size="75%">b</tspan></text><line x1="327" y1="151" x2="422" y2="151" class="muted" marker-end="url(#diagram-arrow-magnetization-definition)"/><text x="381" y="133" class="" text-anchor="start">n̂</text><text x="91" y="286" class="small" text-anchor="start">M：⊙ 向纸外；K<tspan baseline-shift="sub" font-size="75%">b</tspan> = M × n̂</text></svg>