<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-continuous-field diagram-desc-continuous-field"><title id="diagram-title-continuous-field">源点微元与固定场点</title><desc id="diagram-desc-continuous-field">积分沿带电体的源点进行；同一场点 r 在整个源积分中固定。 r′：微元 dq 的位置；r：固定场点位置；|r−r′|：微元到场点距离</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-continuous-field" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><path d="M65 170 Q105 45 180 100 Q260 175 160 225 Z" class="body"/><circle cx="156" cy="120" r="4" class="point"/><text x="165" y="112" class="" text-anchor="start">dq</text><circle cx="372" cy="175" r="4" class="point"/><text x="381" y="167" class="" text-anchor="start">P</text><circle cx="55" cy="253" r="4" class="point"/><text x="64" y="245" class="" text-anchor="start">O</text><line x1="55" y1="253" x2="156" y2="120" class="muted" marker-end="url(#diagram-arrow-continuous-field)"/><text x="70" y="167" class="" text-anchor="start">r′</text><line x1="55" y1="253" x2="372" y2="175" class="muted" marker-end="url(#diagram-arrow-continuous-field)"/><text x="237" y="237" class="" text-anchor="start">r</text><line x1="156" y1="120" x2="372" y2="175" class="field" marker-end="url(#diagram-arrow-continuous-field)"/><text x="277" y="133" class="" text-anchor="start">r − r′</text><text x="90" y="68" class="small" text-anchor="start">带电体</text></svg>