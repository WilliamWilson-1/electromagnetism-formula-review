<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-rotating-loop diagram-desc-rotating-loop"><title id="diagram-title-rotating-loop">转动线圈的法线与磁场</title><desc id="diagram-desc-rotating-loop">侧视图，线圈平面以斜线表示；正法线始终与线圈平面垂直。θ=ωt+θ0。 θ：B 与正法线夹角；S：每匝平面面积；θ0：初始夹角</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-rotating-loop" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><line x1="142" y1="235" x2="290" y2="65" class="source"/><circle cx="216" cy="150" r="4" class="point"/><text x="225" y="142" class="" text-anchor="start">O</text><line x1="216" y1="150" x2="360" y2="150" class="muted" marker-end="url(#diagram-arrow-rotating-loop)"/><text x="375" y="155" class="" text-anchor="start">B</text><line x1="216" y1="150" x2="313" y2="235" class="field" marker-end="url(#diagram-arrow-rotating-loop)"/><text x="321" y="245" class="" text-anchor="start">n̂，S</text><path d="M278 150 Q279 179 266 193" class="dim"/><text x="286" y="179" class="" text-anchor="start">θ</text><text x="57" y="50" class="small" text-anchor="start">线圈平面侧视</text><text x="65" y="284" class="small" text-anchor="start">磁通角度看法线，不能看线圈平面本身</text></svg>