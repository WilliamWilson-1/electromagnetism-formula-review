<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-induced-circulation diagram-desc-induced-circulation"><title id="diagram-title-induced-circulation">有限圆柱磁区与环向电场</title><desc id="diagram-desc-induced-circulation">示例 B 沿 +z 向纸外且增加，E 沿顺时针，即 Eφ&lt;0。外侧没有局部 B，也可有感生 E。 a：磁区边界；r：到轴线距离；点 / 叉说明与感生场方向配对</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-induced-circulation" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><circle cx="221" cy="151" r="78" class="body"/><circle cx="221" cy="151" r="116" class="dash"/><circle cx="180" cy="142" r="11" class="muted"/><circle cx="180" cy="142" r="2" class="point"/><circle cx="225" cy="142" r="11" class="muted"/><circle cx="225" cy="142" r="2" class="point"/><circle cx="270" cy="142" r="11" class="muted"/><circle cx="270" cy="142" r="2" class="point"/><line x1="221" y1="151" x2="221" y2="73" class="dim"/><text x="232" y="108" class="" text-anchor="start">a</text><line x1="221" y1="151" x2="331" y2="151" class="dim"/><circle cx="337" cy="151" r="4" class="point"/><text x="346" y="143" class="" text-anchor="start">P</text><text x="304" y="176" class="" text-anchor="start">r</text><path d="M221 35 A116 116 0 0 1 337 151" class="field" marker-end="url(#diagram-arrow-induced-circulation)"/><text x="350" y="83" class="small" text-anchor="start">E 顺时针</text><text x="68" y="286" class="small" text-anchor="start">磁区内 r≤a；外区 r&gt;a；a 是磁区半径</text></svg>