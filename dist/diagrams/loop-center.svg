<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-loop-center diagram-desc-loop-center"><title id="diagram-title-loop-center">圆电流的圆心磁场</title><desc id="diagram-desc-loop-center">从线圈轴向看，图示逆时针电流，圆心 B 指向纸外。N 匝时每匝近似同半径并同向。 R：每匝圆环半径；B：圆心处磁场；N：同向线圈总匝数</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-loop-center" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><circle cx="230" cy="152" r="105" class="wire"/><path d="M335 152 A105 105 0 0 0 230 47" class="source" marker-end="url(#diagram-arrow-loop-center)"/><circle cx="230" cy="152" r="4" class="point"/><text x="239" y="144" class="" text-anchor="start">O</text><circle cx="230" cy="152" r="11" class="muted"/><circle cx="230" cy="152" r="2" class="point"/><line x1="230" y1="152" x2="230" y2="47" class="dim"/><text x="243" y="102" class="" text-anchor="start">R</text><text x="330" y="76" class="small" text-anchor="start">I 逆时针</text><text x="71" y="291" class="small" text-anchor="start">R 在环平面内；B 沿轴向，垂直纸面</text></svg>