<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-conductor-equilibrium diagram-desc-conductor-equilibrium"><title id="diagram-title-conductor-equilibrium">导体空腔与两种总电荷</title><desc id="diagram-desc-conductor-equilibrium">深色环形区是导体材料，静电平衡时其中 E=0。腔内有源时，空腔内电场不能一概设零。 q：腔内电荷；Q：导体本身总电荷；内外壁总量由高斯关系与守恒确定</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-conductor-equilibrium" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><circle cx="236" cy="150" r="113" class="body"/><circle cx="218" cy="150" r="66" class="hole"/><circle cx="215" cy="155" r="16" class="source"/><text x="215" y="160" class="" text-anchor="middle">q</text><text x="53" y="55" class="" text-anchor="start">导体自身净电荷 Q</text><text x="149" y="251" class="small" text-anchor="start">内壁总量 −q</text><text x="295" y="107" class="small" text-anchor="start">材料内 E=0</text><text x="320" y="257" class="small" text-anchor="start">外壁 Q+q</text></svg>