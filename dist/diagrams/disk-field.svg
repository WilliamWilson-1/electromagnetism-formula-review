<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-disk-field diagram-desc-disk-field"><title id="diagram-title-disk-field">圆环或圆盘的轴线场</title><desc id="diagram-desc-disk-field">中心 O、固定半径 R、轴向坐标 x 分开量。图示显示轴线上观察点；圆盘为填充的整个圆面。电流环轴正向按电流右手法线约定。 R：圆环 / 圆盘固定半径；x：中心到轴上 P 的有向距离</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-disk-field" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><ellipse cx="145" cy="150" rx="38" ry="94" class="body"/><circle cx="145" cy="150" r="4" class="point"/><text x="154" y="142" class="" text-anchor="start">O</text><line x1="145" y1="150" x2="440" y2="150" class="muted" marker-end="url(#diagram-arrow-disk-field)"/><circle cx="370" cy="150" r="4" class="point"/><text x="379" y="142" class="" text-anchor="start">P</text><line x1="145" y1="150" x2="145" y2="58" class="dim"/><text x="157" y="97" class="" text-anchor="start">R</text><line x1="145" y1="257" x2="370" y2="257" class="dim"/><text x="258" y="281" class="" text-anchor="middle">x</text><line x1="385" y1="150" x2="434" y2="150" class="field" marker-end="url(#diagram-arrow-disk-field)"/><text x="318" y="118" class="" text-anchor="start">E<tspan baseline-shift="sub" font-size="75%">x</tspan></text><text x="67" y="52" class="" text-anchor="start">总电荷 Q</text></svg>