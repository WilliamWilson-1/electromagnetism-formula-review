<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-parallel-wires diagram-desc-parallel-wires"><title id="diagram-title-parallel-wires">两平行长直导线</title><desc id="diagram-desc-parallel-wires">图示同向电流，两线相吸；改成反向电流则相斥。r 是两条轴线间距。 r：轴线间距；F/L：每单位导线长度受力</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-parallel-wires" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><line x1="130" y1="245" x2="130" y2="44" class="source" marker-end="url(#diagram-arrow-parallel-wires)"/><line x1="350" y1="245" x2="350" y2="44" class="source" marker-end="url(#diagram-arrow-parallel-wires)"/><text x="100" y="42" class="" text-anchor="start">I<tspan baseline-shift="sub" font-size="75%">1</tspan></text><text x="360" y="42" class="" text-anchor="start">I<tspan baseline-shift="sub" font-size="75%">2</tspan></text><line x1="137" y1="150" x2="202" y2="150" class="field" marker-end="url(#diagram-arrow-parallel-wires)"/><line x1="343" y1="150" x2="278" y2="150" class="field" marker-end="url(#diagram-arrow-parallel-wires)"/><text x="203" y="140" class="" text-anchor="start">F</text><text x="264" y="140" class="" text-anchor="start">F</text><line x1="130" y1="272" x2="350" y2="272" class="dim"/><text x="240" y="294" class="" text-anchor="middle">r</text></svg>