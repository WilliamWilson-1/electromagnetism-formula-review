<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-line-field diagram-desc-line-field"><title id="diagram-title-line-field">无限长均匀带电直线</title><desc id="diagram-desc-line-field">以 λ&gt;0 为例，电场垂直向外；负线电荷方向相反。 r：到带电直线的垂距；λ：单位长度带电量</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-line-field" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><line x1="160" y1="40" x2="160" y2="250" class="source"/><text x="131" y="52" class="" text-anchor="start">⋮</text><text x="131" y="248" class="" text-anchor="start">⋮</text><text x="145" y="80" class="" text-anchor="start">+</text><text x="145" y="120" class="" text-anchor="start">+</text><text x="145" y="160" class="" text-anchor="start">+</text><text x="145" y="200" class="" text-anchor="start">+</text><circle cx="355" cy="150" r="4" class="point"/><text x="364" y="142" class="" text-anchor="start">P</text><line x1="163" y1="150" x2="326" y2="150" class="field" marker-end="url(#diagram-arrow-line-field)"/><text x="270" y="133" class="" text-anchor="start">E</text><line x1="160" y1="209" x2="355" y2="209" class="dim"/><text x="250" y="232" class="small" text-anchor="middle">r：垂直到轴线</text><text x="177" y="78" class="" text-anchor="start">λ（C/m）</text></svg>