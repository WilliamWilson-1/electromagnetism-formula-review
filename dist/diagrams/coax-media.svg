156" class="muted"/><line x1="102" y1="156" x2="112" y2="146" class="muted"/><circle cx="213.99999999999997" cy="44" r="11" class="muted"/><line x1="208.99999999999997" y1="39" x2="218.99999999999997" y2="49" class="muted"/><line x1="208.99999999999997" y1="49" x2="218.99999999999997" y2="39" class="muted"/><line x1="214" y1="151" x2="259" y2="151" class="dim"/><text x="236" y="174" class="" text-anchor="start">a</text><line x1="214" y1="151" x2="214" y2="57" class="dim"/><text x="223" y="94" class="" text-anchor="start">b</text><line x1="214" y1="151" x2="129" y2="66" class="dim"/><text x="130" y="87" class="" text-anchor="start">c</text><circle cx="368" cy="151" r="4" class="point"/><text x="377" y="143" class="" text-anchor="start">P</text><text x="260" y="224" class="small" text-anchor="start">介质 μ</text><text x="365" y="181" class="small" text-anchor="start">r 从轴心量</text><text x="60" y="290" class="small" text-anchor="start">⊙ 去流 I；⊗ 回流 I；a &lt; b &lt; c</text></svg>