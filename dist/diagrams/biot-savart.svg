<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-biot-savart diagram-desc-biot-savart"><title id="diagram-title-biot-savart">电流元与源到场点位移</title><desc id="diagram-desc-biot-savart">示意电流元向上、场点在其右上方，按 I dℓ×r̂ 得该微元的磁场向纸里。微元并非整个导线。 I dℓ：有向电流元；r̂：从当前源点指向 P；dB：单个微元对场的贡献</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-biot-savart" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><line x1="146" y1="225" x2="146" y2="75" class="dash"/><line x1="146" y1="166" x2="146" y2="114" class="source" marker-end="url(#diagram-arrow-biot-savart)"/><text x="60" y="139" class="" text-anchor="start">I dℓ ↑</text><circle cx="146" cy="166" r="4" class="point"/><circle cx="355" cy="99" r="4" class="point"/><text x="364" y="91" class="" text-anchor="start">P</text><line x1="146" y1="166" x2="349" y2="101" class="field" marker-end="url(#diagram-arrow-biot-savart)"/><text x="240" y="151" class="" text-anchor="start">r，r̂</text><circle cx="404" cy="101" r="11" class="muted"/><line x1="399" y1="96" x2="409" y2="106" class="muted"/><line x1="399" y1="106" x2="409" y2="96" class="muted"/><text x="379" y="136" class="small" text-anchor="start">dB 向里</text><text x="64" y="281" class="small" text-anchor="start">r 从当前电流元量到 P；每个微元各不相同</text></svg>