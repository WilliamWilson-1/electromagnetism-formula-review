<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-arc-center diagram-desc-arc-center"><title id="diagram-title-arc-center">圆弧电流在圆心的磁场</title><desc id="diagram-desc-arc-center">示意逆时针电流的一段圆弧，其圆心磁场指向纸外；圆心角使用弧度。 R：圆弧半径；φ：圆心角，整圆为 2π；本式仅求圆心场</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-arc-center" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><path d="M311.25 225.25 A105 105 0 1 0 162.75 225.25" class="source" marker-end="url(#diagram-arrow-arc-center)"/><circle cx="237" cy="151" r="4" class="point"/><text x="246" y="143" class="" text-anchor="start">O</text><line x1="237" y1="151" x2="311.25" y2="225.25" class="dim"/><line x1="237" y1="151" x2="162.75" y2="225.25" class="dash"/><text x="283" y="178" class="" text-anchor="start">R</text><path d="M268.82 182.82 A45 45 0 1 0 205.18 182.82" class="dim"/><text x="232" y="105" class="" text-anchor="start">φ</text><circle cx="237" cy="151" r="11" class="muted"/><circle cx="237" cy="151" r="2" class="point"/><text x="66" y="208" class="small" text-anchor="start">I 逆时针</text><text x="285" y="275" class="small" text-anchor="start">B 在圆心向纸外</text></svg>