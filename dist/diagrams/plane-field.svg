<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-plane-field diagram-desc-plane-field"><title id="diagram-title-plane-field">无限大均匀带电平面</title><desc id="diagram-desc-plane-field">示意非导体薄片的双侧电场；正 σ 时两侧均背离薄片。导体表面紧外侧需用不同边界条件。 σ：薄片面电荷密度；E：两侧分别计算的场强</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-plane-field" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><path d="M155 60 L240 35 L240 230 L155 255 Z" class="body"/><text x="190" y="95" class="" text-anchor="start">+</text><text x="190" y="150" class="" text-anchor="start">+</text><text x="190" y="205" class="" text-anchor="start">+</text><line x1="155" y1="148" x2="68" y2="148" class="field" marker-end="url(#diagram-arrow-plane-field)"/><line x1="240" y1="148" x2="367" y2="148" class="field" marker-end="url(#diagram-arrow-plane-field)"/><text x="80" y="128" class="" text-anchor="start">E</text><text x="323" y="128" class="" text-anchor="start">E</text><text x="267" y="68" class="" text-anchor="start">σ &gt; 0</text></svg>