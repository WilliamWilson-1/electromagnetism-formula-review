<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-wave-equation diagram-desc-wave-equation"><title id="diagram-title-wave-equation">沿 +x 传播的横向场</title><desc id="diagram-desc-wave-equation">在一个相位为正的瞬间，E 沿 +y、H 沿 +z，E×H 沿 +x。负半周期两场同时反向，能流仍向前。 场的方向与传播方向互相垂直；图示正相位的矢量方向，不代表场大小比例</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-wave-equation" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><line x1="103" y1="224" x2="437" y2="224" class="muted" marker-end="url(#diagram-arrow-wave-equation)"/><text x="438" y="249" class="" text-anchor="start">+x</text><line x1="136" y1="224" x2="136" y2="51" class="field" marker-end="url(#diagram-arrow-wave-equation)"/><text x="151" y="61" class="" text-anchor="start">E，+y</text><line x1="136" y1="224" x2="59" y2="283" class="source" marker-end="url(#diagram-arrow-wave-equation)"/><text x="29" y="284" class="small" text-anchor="start">H，+z</text><line x1="172" y1="201" x2="396" y2="201" class="field" marker-end="url(#diagram-arrow-wave-equation)"/><text x="266" y="180" class="" text-anchor="start">S = E × H</text><text x="221" y="75" class="" text-anchor="start">E 与 H 同相</text><text x="207" y="111" class="small" text-anchor="start">相位：ω(t−x/v)+φ<tspan baseline-shift="sub" font-size="75%">0</tspan></text><text x="221" y="139" class="small" text-anchor="start">E<tspan baseline-shift="sub" font-size="75%">0</tspan> / H<tspan baseline-shift="sub" font-size="75%">0</tspan> = √(μ / ε)</text></svg>