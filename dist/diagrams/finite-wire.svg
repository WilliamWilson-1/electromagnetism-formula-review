<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-finite-wire diagram-desc-finite-wire"><title id="diagram-title-finite-wire">直导线、垂足与场点</title><desc id="diagram-desc-finite-wire">图示导线电流由端点1流向端点2；垂足两侧的有向角一负一正。半无限与无限长是对应极限。 O：垂足；a：到导线延长线的垂距；α1、α2：同一有向角约定</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-finite-wire" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><line x1="150" y1="250" x2="150" y2="38" class="source" marker-end="url(#diagram-arrow-finite-wire)"/><text x="125" y="37" class="" text-anchor="start">I</text><circle cx="150" cy="227" r="4" class="point"/><text x="159" y="219" class="" text-anchor="start">1</text><circle cx="150" cy="65" r="4" class="point"/><text x="159" y="57" class="" text-anchor="start">2</text><circle cx="150" cy="150" r="4" class="point"/><text x="159" y="142" class="" text-anchor="start">O</text><circle cx="367" cy="150" r="4" class="point"/><text x="376" y="142" class="" text-anchor="start">P</text><line x1="150" y1="150" x2="367" y2="150" class="dim"/><text x="258" y="170" class="" text-anchor="start">a 或 r</text><line x1="367" y1="150" x2="150" y2="65" class="dash"/><line x1="367" y1="150" x2="150" y2="227" class="dash"/><text x="296" y="116" class="small" text-anchor="start">α<tspan baseline-shift="sub" font-size="75%">2</tspan> &gt; 0</text><text x="296" y="206" class="small" text-anchor="start">α<tspan baseline-shift="sub" font-size="75%">1</tspan> &lt; 0</text><circle cx="412" cy="146" r="11" class="muted"/><line x1="407" y1="141" x2="417" y2="151" class="muted"/><line x1="407" y1="151" x2="417" y2="141" class="muted"/><text x="391" y="184" class="small" text-anchor="start">B 向里</text></svg>