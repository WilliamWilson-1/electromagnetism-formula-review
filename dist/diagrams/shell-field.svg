<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-shell-field diagram-desc-shell-field"><title id="diagram-title-shell-field">球对称模型的半径与场点</title><desc id="diagram-desc-shell-field">二维图是经过球心的剖面。虚线仅表示选取的高斯面；它不是实体表面。 R：球体或球壳半径；r：场点到球心 O 的距离</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-shell-field" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><circle cx="200" cy="150" r="80" class="wire"/><circle cx="200" cy="150" r="120" class="dash"/><circle cx="200" cy="150" r="4" class="point"/><text x="209" y="142" class="" text-anchor="start">O</text><circle cx="259" cy="122" r="4" class="point"/><text x="268" y="114" class="" text-anchor="start">P 内</text><circle cx="320" cy="150" r="4" class="point"/><text x="329" y="142" class="" text-anchor="start">P 外</text><line x1="200" y1="150" x2="201" y2="70" class="dim"/><text x="211" y="101" class="" text-anchor="start">R</text><line x1="200" y1="150" x2="314" y2="150" class="dim"/><text x="295" y="173" class="" text-anchor="start">r</text><text x="78" y="285" class="small" text-anchor="start">电荷分布于球壳表面；固定边界半径 R</text></svg>