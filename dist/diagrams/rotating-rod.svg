<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-rotating-rod diagram-desc-rotating-rod"><title id="diagram-title-rotating-rod">转动棒的局部速率</title><desc id="diagram-desc-rotating-rod">示例 ω 逆时针、B 向纸外。沿径向 v×B 向外；反转任一方向会交换高低电势。 r：转轴到微元距离；ℓ：转轴在端点时的全棒长</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-rotating-rod" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><circle cx="115" cy="200" r="4" class="point"/><text x="124" y="192" class="" text-anchor="start">O 转轴</text><line x1="115" y1="200" x2="350" y2="200" class="source"/><circle cx="264" cy="200" r="4" class="point"/><text x="273" y="192" class="" text-anchor="start">微元</text><line x1="264" y1="200" x2="264" y2="105" class="muted" marker-end="url(#diagram-arrow-rotating-rod)"/><text x="279" y="118" class="" text-anchor="start">v=ωr</text><line x1="115" y1="238" x2="264" y2="238" class="dim"/><text x="183" y="262" class="" text-anchor="middle">r</text><line x1="115" y1="281" x2="350" y2="281" class="dim"/><text x="245" y="299" class="" text-anchor="middle">ℓ</text><circle cx="392" cy="75" r="11" class="muted"/><circle cx="392" cy="75" r="2" class="point"/><text x="372" y="106" class="" text-anchor="start">B</text><path d="M155 174 A48 48 0 0 0 108 153" class="field" marker-end="url(#diagram-arrow-rotating-rod)"/><text x="93" y="133" class="" text-anchor="start">ω</text></svg>