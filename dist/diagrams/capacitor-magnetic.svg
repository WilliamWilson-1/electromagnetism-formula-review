<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-capacitor-magnetic diagram-desc-capacitor-magnetic"><title id="diagram-title-capacitor-magnetic">圆形极板内的环路面积</title><desc id="diagram-desc-capacitor-magnetic">从轴向看极板：D 的变化沿 +z 时，位移电流向纸外，B 逆时针。小环路只包围 πr² 的位移通量变化。 a：极板半径；r：圆周环路半径；⊙：∂D/∂t 朝纸外</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-capacitor-magnetic" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><circle cx="225" cy="151" r="116" class="body"/><circle cx="225" cy="151" r="72" class="dash"/><circle cx="210" cy="133" r="11" class="muted"/><circle cx="210" cy="133" r="2" class="point"/><circle cx="250" cy="162" r="11" class="muted"/><circle cx="250" cy="162" r="2" class="point"/><line x1="225" y1="151" x2="225" y2="35" class="dim"/><text x="236" y="91" class="" text-anchor="start">a</text><line x1="225" y1="151" x2="297" y2="151" class="dim"/><text x="261" y="176" class="" text-anchor="start">r</text><path d="M297 151 A72 72 0 0 0 225 79" class="field" marker-end="url(#diagram-arrow-capacitor-magnetic)"/><text x="329" y="116" class="" text-anchor="start">B 环向</text><text x="65" y="287" class="small" text-anchor="start">r&lt;a：包围面积 πr²；整个极板面积 πa²</text></svg>