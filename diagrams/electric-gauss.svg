<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-electric-gauss diagram-desc-electric-gauss"><title id="diagram-title-electric-gauss">闭合面与内外场源</title><desc id="diagram-desc-electric-gauss">虚线曲线代表闭合面的剖面，正法向向外。面外电荷影响局部场，但不进入包围净电荷。 虚线：闭合积分面；正法向：由内部指向外部</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-electric-gauss" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><ellipse cx="225" cy="155" rx="135" ry="91" class="dash"/><circle cx="180" cy="155" r="18" class="source"/><text x="180" y="161" class="" text-anchor="middle">+</text><circle cx="270" cy="180" r="18" class="body"/><text x="270" y="185" class="" text-anchor="middle">−</text><circle cx="424" cy="105" r="16" class="source"/><text x="424" y="111" class="" text-anchor="middle">+</text><line x1="225" y1="64" x2="225" y2="27" class="muted" marker-end="url(#diagram-arrow-electric-gauss)"/><text x="237" y="34" class="" text-anchor="start">n̂</text><text x="119" y="269" class="small" text-anchor="start">闭合面 S；面内电荷按代数和计</text><text x="367"