<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-ferro-characteristics diagram-desc-ferro-characteristics"><title id="diagram-title-ferro-characteristics">磁滞回线的截距</title><desc id="diagram-desc-ferro-characteristics">这是形状示意，没有数值比例。沿指定退磁分支读剩磁和矫顽力，不能只看当前 H。 Br：H=0 的 B 截距；−Hc：相应退磁分支的 B=0 横截距</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-ferro-characteristics" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><line x1="55" y1="164" x2="435" y2="164" class="muted" marker-end="url(#diagram-arrow-ferro-characteristics)"/><line x1="240" y1="271" x2="240" y2="30" class="muted" marker-end="url(#diagram-arrow-ferro-characteristics)"/><text x="438" y="157" class="" text-anchor="start">H</text><text x="251" y="31" class="" text-anchor="start">B</text><path d="M80 250 Q130 250 170 164 Q200 88 240 88 Q300 78 400 78 Q350 78 310 164 Q280 240 240 240 Q180 250 80 250 Z" class="field"/><line x1="170" y1="164" x2="170" y2="192" class="dash"/><text x="150" y="213" class="" text-anchor="start">−Hc</text><circle cx="240" cy="88" r="4" class="point"/><text x="251" y="89" class="" text-anchor="start">Br</text><text x="62" y="294" class="small" text-anchor="start">曲线仅示意；截距应从实际题图读取</text></svg>