<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-current-cylinder diagram-desc-current-cylinder"><title id="diagram-title-current-cylinder">长圆柱的横截面</title><desc id="diagram-desc-current-cylinder">图为垂直长轴的横截面；从轴心量 r。电流模型以电流向纸外为例，B 沿逆时针环向。 R：实体边界半径；r：从轴心到场点；虚线：通过外场点的积分面 / 环路</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-current-cylinder" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><circle cx="210" cy="150" r="76" class="body"/><circle cx="210" cy="150" r="115" class="dash"/><circle cx="210" cy="150" r="4" class="point"/><text x="219" y="142" class="" text-anchor="start">O</text><line x1="210" y1="150" x2="210" y2="74" class="dim"/><text x="223" y="112" class="" text-anchor="start">R</text><line x1="210" y1="150" x2="319" y2="150" class="dim"/><circle cx="325" cy="150" r="4" class="point"/><text x="334" y="142" class="" text-anchor="start">P</text><text x="287" y="175" class="" text-anchor="start">r</text><circle cx="180" cy="125" r="11" class="muted"/><circle cx="180" cy="125" r="2" class="point"/><path d="M325 150 A115 115 0 0 0 285 63" class="field" marker-end="url(#diagram-arrow-current-cylinder)"/><text x="340" y="94" class="" text-anchor="start">B</text><text x="73" y="285" class="small" text-anchor="start">实体边界 r=R；r&lt;R 为内部</text></svg>