<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-dipole-moment diagram-desc-dipole-moment"><title id="diagram-title-dipole-moment">电偶极子</title><desc id="diagram-desc-dipole-moment">偶极矩从负电荷指向正电荷。远场点与中心的距离应远大于两电荷间距。 ℓ：−q 到 +q 的位移；p：电偶极矩；r：偶极中心到 P</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-dipole-moment" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><circle cx="110" cy="164" r="20" class="body"/><text x="110" y="170" class="" text-anchor="middle">−q</text><circle cx="250" cy="164" r="20" class="source"/><text x="250" y="170" class="" text-anchor="middle">+q</text><line x1="135" y1="164" x2="222" y2="164" class="field" marker-end="url(#diagram-arrow-dipole-moment)"/><text x="180" y="141" class="" text-anchor="middle">ℓ → p</text><circle cx="180" cy="164" r="3" class="point"/><text x="177" y="193" class="" text-anchor="start">O</text><circle cx="392" cy="68" r="4" class="point"/><text x="401" y="60" class="" text-anchor="start">P</text><line x1="180" y1="164" x2="386" y2="73" class="dim"/><text x="310" y="133" class="" text-anchor="start">r</text><text x="240" y="260" class="small" text-anchor="middle">偶极中心 O；远场 r ≫ |ℓ|</text></svg>