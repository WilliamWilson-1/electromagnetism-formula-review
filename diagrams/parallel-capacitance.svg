<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-parallel-capacitance diagram-desc-parallel-capacitance"><title id="diagram-title-parallel-capacitance">电容器串联 / 并联</title><desc id="diagram-desc-parallel-capacitance">上方是标准串联，下方是并联；两个电容只是示例，求和关系适用于更多元件。 串联：同一支路，检查中间节点电荷；并联：各元件连接同一对节点</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-parallel-capacitance" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><line x1="50" y1="78" x2="140" y2="78" class="wire"/><line x1="140" y1="52" x2="140" y2="104" class="wire"/><line x1="152" y1="52" x2="152" y2="104" class="wire"/><line x1="152" y1="78" x2="310" y2="78" class="wire"/><line x1="310" y1="52" x2="310" y2="104" class="wire"/><line x1="322" y1="52" x2="322" y2="104" class="wire"/><line x1="322" y1="78" x2="430" y2="78" class="wire"/><text x="134" y="35" class="" text-anchor="start">C<tspan baseline-shift="sub" font-size="75%">1</tspan></text><text x="304" y="35" class="" text-anchor="start">C<tspan baseline-shift="sub" font-size="75%">2</tspan></text><text x="210" y="117" class="small" text-anchor="start">串联</text><path d="M50 215 H100 V167 H230 M100 215 V263 H230 M252 167 H385 V263 H252 M385 215 H430" class="wire"/><line x1="230" y1="143" x2="230" y2="191" class="wire"/><line x1="252" y1="143" x2="252" y2="191" class="wire"/><line x1="230" y1="239" x2="230" y2="287" class="wire"/><line x1="252" y1="239" x2="252" y2="287" class="wire"/><text x="266" y="155" class="" text-anchor="start">C<tspan baseline-shift="sub" font-size="75%">1</tspan></text><text x="266" y="253" class="" text-anchor="start">C<tspan baseline-shift="sub" font-size="75%">2</tspan></text><text x="408" y="249" class="small" text-anchor="start">并联</text></svg>