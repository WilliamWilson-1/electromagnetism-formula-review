<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-polarization diagram-desc-polarization"><title id="diagram-title-polarization">介质极化与有向表面</title><desc id="diagram-desc-polarization">线性各向同性介质的一个取向示例；D 的定义关系本身更一般。表面电荷符号由 P·n̂ 判断。 P：偶极矩密度；n̂：介质外法向；σb=P·n̂：表面有向投影</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-polarization" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><rect x="145" y="64" width="190" height="175" rx="4" class="body"/><circle cx="175" cy="100" r="6" class="body"/><text x="172" y="104" class="small" text-anchor="start">−</text><circle cx="211" cy="100" r="6" class="source"/><text x="208" y="104" class="small" text-anchor="start">+</text><line x1="183" y1="100" x2="202" y2="100" class="field" marker-end="url(#diagram-arrow-polarization)"/><circle cx="250" cy="100" r="6" class="body"/><text x="247" y="104" class="small" text-anchor="start">−</text><circle cx="286" cy="100" r="6" class="source"/><text x="283" y="104" class="small" text-anchor="start">+</text><line x1="258" y1="100" x2="277" y2="100" class="field" marker-end="url(#diagram-arrow-polarization)"/><circle cx="175" cy="150" r="6" class="body"/><text x="172" y="154" class="small" text-anchor="start">−</text><circle cx="211" cy="150" r="6" class="source"/><text x="208" y="154" class="small" text-anchor="start">+</text><line x1="183" y1="150" x2="202" y2="150" class="field" marker-end="url(#diagram-arrow-polarization)"/><circle cx="250" cy="150" r="6" class="body"/><text x="247" y="154" class="small" text-anchor="start">−</text><circle cx="286" cy="150" r="6" class="source"/><text x="283" y="154" class="small" text-anchor="start">+</text><line x1="258" y1="150" x2="277" y2="150" class="field" marker-end="url(#diagram-arrow-polarization)"/><circle cx="175" cy="200" r="6" class="body"/><text x="172" y="204" class="small" text-anchor="start">−</text><circle cx="211" cy="200" r="6" class="source"/><text x="208" y="204" class="small" text-anchor="start">+</text><line x1="183" y1="200" x2="202" y2="200" class="field" marker-end="url(#diagram-arrow-polarization)"/><circle cx="250" cy="200" r="6" class="body"/><text x="247" y="204" class="small" text-anchor="start">−</text><circle cx="286" cy="200" r="6" class="source"/><text x="283" y="204" class="small" text-anchor="start">+</text><line x1="258" y1="200" x2="277" y2="200" class="field" marker-end="url(#diagram-arrow-polarization)"/><line x1="100" y1="270" x2="370" y2="270" class="field" marker-end="url(#diagram-arrow-polarization)"/><text x="400" y="275" class="" text-anchor="start">E</text><line x1="339" y1="152" x2="430" y2="152" class="muted" marker-end="url(#diagram-arrow-polarization)"/><text x="389" y="133" class="" text-anchor="start">n̂</text><text x="165" y="43" class="small" text-anchor="start">P →；介质区域</text></svg>