<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-hall-field diagram-desc-hall-field"><title id="diagram-title-hall-field">霍尔效应的三个方向</title><desc id="diagram-desc-hall-field">图示正载流子、I 向右、B 向纸里。上侧积累正电荷，横向电场向下；电子情形要重判。 t：样品沿磁场方向的厚度；UH：需指定测量端点的顺序</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-hall-field" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><rect x="80" y="80" width="330" height="125" rx="4" class="body"/><text x="105" y="99" class="" text-anchor="start">+</text><text x="160" y="99" class="" text-anchor="start">+</text><text x="215" y="99" class="" text-anchor="start">+</text><text x="270" y="99" class="" text-anchor="start">+</text><text x="325" y="99" class="" text-anchor="start">+</text><text x="380" y="99" class="" text-anchor="start">+</text><text x="110" y="193" class="" text-anchor="start">−    −    −    −    −</text><line x1="109" y1="145" x2="227" y2="145" class="source" marker-end="url(#diagram-arrow-hall-field)"/><text x="133" y="129" class="" text-anchor="start">I，v<tspan baseline-shift="sub" font-size="75%">d</tspan></text><line x1="287" y1="111" x2="287" y2="179" class="field" marker-end="url(#diagram-arrow-hall-field)"/><text x="300" y="149" class="" text-anchor="start">E<tspan baseline-shift="sub" font-size="75%">H</tspan></text><circle cx="370" cy="145" r="11" class="muted"/><line x1="365" y1="140" x2="375" y2="150" class="muted"/><line x1="365" y1="150" x2="375" y2="140" class="muted"/><text x="72" y="242" class="small" text-anchor="start">U<tspan baseline-shift="sub" font-size="75%">H</tspan>：上、下侧之间测量</text><text x="72" y="273" class="small" text-anchor="start">t 沿 B 方向，垂直纸面，不是图中竖边</text></svg>