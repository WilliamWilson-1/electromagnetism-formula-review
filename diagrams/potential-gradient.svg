<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-potential-gradient diagram-desc-potential-gradient"><title id="diagram-title-potential-gradient">初末位置、电势与电场方向</title><desc id="diagram-desc-potential-gradient">示意静电场中正电荷从 a 移到 b。公式的端点顺序为 Va−Vb；负电荷做功符号反转。 竖虚线：等势面剖面；电场指向电势下降方向</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-potential-gradient" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><line x1="100" y1="60" x2="100" y2="228" class="dash"/><line x1="240" y1="60" x2="240" y2="228" class="dash"/><line x1="380" y1="60" x2="380" y2="228" class="dash"/><line x1="70" y1="135" x2="425" y2="135" class="field" marker-end="url(#diagram-arrow-potential-gradient)"/><text x="410" y="110" class="" text-anchor="start">E</text><circle cx="100" cy="135" r="4" class="point"/><text x="109" y="127" class="" text-anchor="start">a</text><circle cx="380" cy="135" r="4" class="point"/><text x="389" y="127" class="" text-anchor="start">b</text><text x="70" y="255" class="small" text-anchor="start">Vₐ 高</text><text x="350" y="255" class="small" text-anchor="start">V<tspan baseline-shift="sub" font-size="75%">b</tspan> 低</text><path d="M105 178 Q230 218 374 177" class="muted" marker-end="url(#diagram-arrow-potential-gradient)"/><text x="214" y="216" class="small" text-anchor="start">路径 a → b</text></svg>