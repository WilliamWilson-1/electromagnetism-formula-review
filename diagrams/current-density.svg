<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-current-density diagram-desc-current-density"><title id="diagram-title-current-density">电流与横截面</title><desc id="diagram-desc-current-density">示意正载流子的漂移；电子的漂移方向与常规电流相反。只对截面法向分量积分。 截面：不是导体表面积；n：m⁻³；q：单个载流子电荷</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-current-density" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><rect x="65" y="80" width="344" height="132" rx="4" class="body"/><ellipse cx="310" cy="146" rx="24" ry="66" class="dash"/><circle cx="100" cy="145" r="7" class="source"/><line x1="111" y1="145" x2="148" y2="145" class="field" marker-end="url(#diagram-arrow-current-density)"/><circle cx="165" cy="145" r="7" class="source"/><line x1="176" y1="145" x2="213" y2="145" class="field" marker-end="url(#diagram-arrow-current-density)"/><circle cx="230" cy="145" r="7" class="source"/><line x1="241" y1="145" x2="278" y2="145" class="field" marker-end="url(#diagram-arrow-current-density)"/><line x1="311" y1="241" x2="403" y2="241" cla