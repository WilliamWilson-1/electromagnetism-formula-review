<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-rail-dynamics diagram-desc-rail-dynamics"><title id="diagram-title-rail-dynamics">斜导轨的投影关系</title><desc id="diagram-desc-rail-dynamics">图为导轨所在斜面的侧视示意；棒横跨两轨，垂直本侧视面，长度 ℓ。B 竖直，不能直接用全 B 当法向场。 α：斜面与水平夹角；Bcosα：穿过回路的法向分量</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-rail-dynamics" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><line x1="92" y1="242" x2="402" y2="100" class="wire"/><line x1="92" y1="242" x2="407" y2="242" class="dash"/><circle cx="257" cy="166" r="11" class="source"/><line x1="257" y1="166" x2="172" y2="205" class="source" marker-end="url(#diagram-arrow-rail-dynamics)"/><text x="167" y="184" class="" text-anchor="start">v 下滑</text><line x1="257" y1="166" x2="257" y2="55" class="field" marker-end="url(#diagram-arrow-rail-dynamics)"/><text x="269" y="61" class="" text-anchor="start">B</text><line x1="257" y1="166" x2="318" y2="138" class="muted" marker-end="url(#diagram-arrow-rail-dynamics)"/><text x="321" y="126" class="small" text-anchor="start">磁阻力投影</text><text x="132" y="231" class="" text-anchor="start">α</text><text x="62" y="285" class="small" text-anchor="start">○ 棒的横截面；重力方向竖直向下</text></svg>