<svg xmlns="http://www.w3.org/2000/svg" class="model-svg" viewBox="0 0 480 320" role="img" aria-labelledby="diagram-title-wire-loop-mutual diagram-desc-wire-loop-mutual"><title id="diagram-title-wire-loop-mutual">长直导线与矩形线框</title><desc id="diagram-desc-wire-loop-mutual">矩形与长直导线共面。近、远边距 r1、r2 都从源导线量起；a 是平行于源导线的边长。 线框宽度为 r2−r1；窄条面积为 a dr；源1产生穿过线框2的磁通</desc><style>.model-svg{color:#1c2a25;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.model-svg text{fill:currentColor;stroke:none}.model-svg .small{font-size:13px;fill:#52635b}.model-svg .wire{fill:none;stroke:currentColor;stroke-width:2}.model-svg .field{fill:none;stroke:#176444;stroke-width:2.5}.model-svg .source{fill:#e5f0e9;stroke:#176444;stroke-width:2.3}.model-svg .body{fill:#e5f0e9;stroke:currentColor;stroke-width:1.8}.model-svg .hole{fill:#f0f6f2;stroke:currentColor;stroke-width:1.8}.model-svg .muted,.model-svg .dim{fill:none;stroke:#52635b;stroke-width:1.4}.model-svg .dash{fill:none;stroke:#52635b;stroke-width:1.3;stroke-dasharray:6 5}.model-svg .point{fill:currentColor;stroke:none}</style><defs><marker id="diagram-arrow-wire-loop-mutual" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#176444" stroke-width="1.5"/></marker></defs><rect width="480" height="320" fill="#f0f6f2"/><line x1="85" y1="250" x2="85" y2="35" class="source" marker-end="url(#diagram-arrow-wire-loop-mutual)"/><text x="65" y="33" class="" text-anchor="start">I<tspan baseline-shift="sub" font-size="75%">1</tspan></text><rect x="220" y="71" width="176" height="158" rx="4" class="body"/><line x1="220" y1="71" x2="396" y2="71" class="wire"/><line x1="85" y1="269" x2="220" y2="269" class="dim"/><text x="152" y="291" class="" text-anchor="middle">r<tspan baseline-shift="sub" font-size="75%">1</tspan></text><line x1="85" y1="44" x2="396" y2="44" class="dim"/><text x="257" y="31" class="" text-anchor="middle">r<tspan baseline-shift="sub" font-size="75%">2</tspan></text><line x1="420" y1="71" x2="420" y2="229" class="dim"/><text x="433" y="156" class="" text-anchor="start">a</text><rect x="279" y="71" width="10" height="158" rx="4" class="source"/><text x="270" y="252" class="small" text-anchor="start">dr</text></svg>